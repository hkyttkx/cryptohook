name: Build CryptoHook (dylib + IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: |
          curl -L -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64
          chmod +x /tmp/ldid && sudo mv /tmp/ldid /usr/local/bin/ldid || true

      - name: Build dylib
        run: |
          set +e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p dist
          xcrun --sdk iphoneos clang \
            -arch arm64 -arch arm64e \
            -isysroot "$SDK" -miphoneos-version-min=14.0 \
            -dynamiclib -fobjc-arc -O2 \
            -o dist/CryptoHook.dylib CryptoHook.m \
            -framework Foundation -framework UIKit -framework Security \
            -install_name @executable_path/Frameworks/CryptoHook.dylib > dylib.log 2>&1
          EXIT=$?
          cat dylib.log
          [ $EXIT -ne 0 ] && { grep -E "error:" dylib.log | head -30 | while IFS= read -r l; do echo "::error title=clang-dylib::$l"; done; tail -8 dylib.log | grep -v '^$' | while IFS= read -r l; do echo "::error title=tail::$l"; done; exit 1; }
          ldid -S dist/CryptoHook.dylib || true

      - name: Build app
        run: |
          set +e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build
          xcrun --sdk iphoneos clang \
            -arch arm64 -arch arm64e \
            -isysroot "$SDK" -miphoneos-version-min=14.0 \
            -fobjc-arc -O2 -I viewer \
            -o build/CryptoViewer \
            viewer/main.m viewer/CHTheme.m viewer/CHModels.m \
            viewer/CHServices.m viewer/CHRootVC.m viewer/CHDetailVC.m \
            viewer/CHSplashVC.m viewer/CHRecordDetailVC.m \
            viewer/CHSettingsVC.m \
            -framework UIKit -framework Foundation \
            -framework QuartzCore -framework CoreGraphics > app.log 2>&1
          EXIT=$?
          cat app.log
          [ $EXIT -ne 0 ] && { grep -E "error:" app.log | head -40 | while IFS= read -r l; do echo "::error title=clang-app::$l"; done; exit 1; }
          file build/CryptoViewer

      - name: Package IPA (icons + splash)
        run: |
          APP=pkg/Payload/CryptoViewer.app
          rm -rf pkg && mkdir -p "$APP"
          cp build/CryptoViewer "$APP/"
          cp viewer/Info.plist  "$APP/"
          cp dist/CryptoHook.dylib "$APP/"
          # 启动图
          cp viewer/Resources/splash.jpg "$APP/splash.jpg"
          # 生成 App 图标（用同一张图）
          sips -s format png -z 120 120 viewer/Resources/splash.jpg --out "$APP/AppIcon60x60@2x.png" >/dev/null
          sips -s format png -z 180 180 viewer/Resources/splash.jpg --out "$APP/AppIcon60x60@3x.png" >/dev/null
          sips -s format png -z 152 152 viewer/Resources/splash.jpg --out "$APP/AppIcon76x76@2x~ipad.png" >/dev/null
          sips -s format png -z 167 167 viewer/Resources/splash.jpg --out "$APP/AppIcon83.5x83.5@2x~ipad.png" >/dev/null
          sips -s format png -z 1024 1024 viewer/Resources/splash.jpg --out "$APP/AppIcon1024.png" >/dev/null
          ls -la "$APP/"
          cd pkg && zip -qr ../dist/CryptoViewer.ipa Payload && cd ..

      - name: Sign with entitlements
        run: |
          APP=pkg/Payload/CryptoViewer.app
          ldid -Sviewer/entitlements.plist "$APP/CryptoViewer" || true
          ldid -e "$APP/CryptoViewer" | head -20 || true
          rm -f dist/CryptoViewer.ipa
          cd pkg && zip -qr ../dist/CryptoViewer.ipa Payload && cd ..
          ls -la dist/

      - name: Commit back
        run: |
          git config user.name  "gh-actions"
          git config user.email "actions@github.com"
          git add -f dist/CryptoHook.dylib dist/CryptoViewer.ipa
          git commit -m "build: splash + icons + detail page [skip ci]" || echo "no change"
          git push

name: Build CryptoHook (dylib + IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: |
          curl -L -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64
          chmod +x /tmp/ldid && sudo mv /tmp/ldid /usr/local/bin/ldid
          ldid -h 2>&1 | head -2 || true

      - name: Build dylib
        run: |
          set +e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p dist
          xcrun --sdk iphoneos clang \
            -arch arm64 -arch arm64e \
            -isysroot "$SDK" -miphoneos-version-min=14.0 \
            -dynamiclib -fobjc-arc -O2 \
            -o dist/CryptoHook.dylib CryptoHook.m \
            -framework Foundation -framework UIKit -framework Security \
            -install_name @executable_path/Frameworks/CryptoHook.dylib > dylib.log 2>&1
          EXIT=$?
          cat dylib.log
          if [ $EXIT -ne 0 ]; then
            tail -25 dylib.log | grep -v '^$' | while IFS= read -r l; do echo "::error title=clang-dylib::$l"; done
            exit 1
          fi
          ldid -S dist/CryptoHook.dylib || true

      - name: Build app
        run: |
          set +e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build
          xcrun --sdk iphoneos clang \
            -arch arm64 -arch arm64e \
            -isysroot "$SDK" -miphoneos-version-min=14.0 \
            -fobjc-arc -O2 \
            -I viewer \
            -o build/CryptoViewer \
            viewer/main.m viewer/CHTheme.m viewer/CHModels.m \
            viewer/CHServices.m viewer/CHRootVC.m viewer/CHDetailVC.m \
            -framework UIKit -framework Foundation \
            -framework QuartzCore -framework CoreGraphics > app.log 2>&1
          EXIT=$?
          cat app.log
          if [ $EXIT -ne 0 ]; then
            grep -E "error:" app.log | head -40 | while IFS= read -r l; do echo "::error title=clang-app::$l"; done
            exit 1
          fi
          file build/CryptoViewer

      - name: Package IPA
        run: |
          rm -rf pkg && mkdir -p pkg/Payload/CryptoViewer.app
          cp build/CryptoViewer    pkg/Payload/CryptoViewer.app/
          cp viewer/Info.plist     pkg/Payload/CryptoViewer.app/
          cp dist/CryptoHook.dylib pkg/Payload/CryptoViewer.app/CryptoHook.dylib
          cp viewer/entitlements.plist pkg/Payload/CryptoViewer.app/entitlements.plist
          cd pkg && zip -qr ../dist/CryptoViewer.ipa Payload
          cd .. && ls -la dist/

      - name: Sign with entitlements
        run: |
          APP=pkg/Payload/CryptoViewer.app
          ldid -Sviewer/entitlements.plist "$APP/CryptoViewer"
          echo "=== 签后 entitlements ==="
          ldid -e "$APP/CryptoViewer" | head -30
          rm -f "$APP/entitlements.plist"
          rm -f dist/CryptoViewer.ipa
          cd pkg && zip -qr ../dist/CryptoViewer.ipa Payload
          cd .. && ls -la dist/

      - name: Commit back
        run: |
          git config user.name  "gh-actions"
          git config user.email "actions@github.com"
          git add -f dist/CryptoHook.dylib dist/CryptoViewer.ipa
          git commit -m "build: with entitlements [skip ci]" || echo "no change"
          git push
